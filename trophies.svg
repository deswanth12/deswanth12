<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="880" height="140" role="img" aria-label="Anime Achievement Trophies">
<title>Anime Achievement Trophies</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&family=Outfit:wght@700&display=swap');
text { font-family: 'Fira Code', Consolas, monospace; }
.t-title { font-family: 'Outfit', sans-serif; fill: #ffd166; font-size: 13px; font-weight: 700; }
.t-desc { fill: #c0a0a8; font-size: 10px; }
@keyframes trophyGlow { 0%, 100% { filter: drop-shadow(0 0 4px #ff9f1c); } 50% { filter: drop-shadow(0 0 12px #ffd166); } }
.badge-box { transition: transform 0.2s ease; cursor: pointer; }
.badge-box:hover { transform: translateY(-4px); }
]]></style>
<linearGradient id="tBg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#180a0e"/>
  <stop offset="100%" stop-color="#100508"/>
</linearGradient>
<linearGradient id="tBorder" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff9f1c"/>
  <stop offset="50%" stop-color="#e63946"/>
  <stop offset="100%" stop-color="#ffd166"/>
</linearGradient>
</defs>

<!-- Main Container -->
<rect width="880" height="140" rx="16" fill="url(#tBg)" stroke="url(#tBorder)" stroke-width="2"/>

<!-- 5 Trophy Cards Grid -->
<g transform="translate(20, 20)">

  <!-- Trophy 1 -->
  <g class="badge-box" transform="translate(0, 0)">
    <rect width="156" height="100" rx="12" fill="#240c14" stroke="#ff9f1c" stroke-width="1.5"/>
    <text x="78" y="32" font-size="24" text-anchor="middle">🔥</text>
    <text x="78" y="58" class="t-title" text-anchor="middle">Flame Hashira</text>
    <text x="78" y="76" class="t-desc" text-anchor="middle">Master Web Craftsman</text>
  </g>

  <!-- Trophy 2 -->
  <g class="badge-box" transform="translate(172, 0)">
    <rect width="156" height="100" rx="12" fill="#240c14" stroke="#e63946" stroke-width="1.5"/>
    <text x="78" y="32" font-size="24" text-anchor="middle">⚡</text>
    <text x="78" y="58" class="t-title" text-anchor="middle">Commit Overlord</text>
    <text x="78" y="76" class="t-desc" text-anchor="middle">500+ Contributions</text>
  </g>

  <!-- Trophy 3 -->
  <g class="badge-box" transform="translate(344, 0)">
    <rect width="156" height="100" rx="12" fill="#240c14" stroke="#ffd166" stroke-width="1.5"/>
    <text x="78" y="32" font-size="24" text-anchor="middle">🌟</text>
    <text x="78" y="58" class="t-title" text-anchor="middle">Star Crafter</text>
    <text x="78" y="76" class="t-desc" text-anchor="middle">50+ Repos Stars</text>
  </g>

  <!-- Trophy 4 -->
  <g class="badge-box" transform="translate(516, 0)">
    <rect width="156" height="100" rx="12" fill="#240c14" stroke="#ff6b35" stroke-width="1.5"/>
    <text x="78" y="32" font-size="24" text-anchor="middle">⚔️</text>
    <text x="78" y="58" class="t-title" text-anchor="middle">Sage Mode</text>
    <text x="78" y="76" class="t-desc" text-anchor="middle">Anime Art Legend</text>
  </g>

  <!-- Trophy 5 -->
  <g class="badge-box" transform="translate(688, 0)">
    <rect width="156" height="100" rx="12" fill="#240c14" stroke="#ff9f1c" stroke-width="1.5"/>
    <text x="78" y="32" font-size="24" text-anchor="middle">🐉</text>
    <text x="78" y="58" class="t-title" text-anchor="middle">3D Architect</text>
    <text x="78" y="76" class="t-desc" text-anchor="middle">Three.js Specialist</text>
  </g>

</g>
</svg>
