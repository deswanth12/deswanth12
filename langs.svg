<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 195" width="400" height="195" role="img" aria-label="Most Used Languages Card">
<title>Most Used Languages</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Outfit:wght@700&display=swap');
text { font-family: 'Fira Code', Consolas, monospace; }
.title { font-family: 'Outfit', sans-serif; font-weight: 700; fill: #ffd166; font-size: 16px; }
.lang-name { fill: #ffffff; font-size: 12px; font-weight: 600; }
.lang-pct { fill: #c0a0a8; font-size: 11px; }
@keyframes barGrow { from { width: 0; } }
.bar { animation: barGrow 1.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
]]></style>
<linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#180a0e"/>
  <stop offset="100%" stop-color="#100508"/>
</linearGradient>
<linearGradient id="borderL" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff9f1c"/>
  <stop offset="100%" stop-color="#e63946"/>
</linearGradient>
</defs>

<!-- Card Frame -->
<rect width="400" height="195" rx="14" fill="url(#bgL)" stroke="url(#borderL)" stroke-width="2"/>

<!-- Header -->
<g transform="translate(25, 35)">
  <text class="title" x="0" y="0">⚔️ MOST USED LANGUAGES</text>
  <line x1="0" y1="12" x2="350" y2="12" stroke="#e63946" stroke-width="1" opacity="0.4"/>
</g>

<!-- Language Progress Bars -->
<g transform="translate(25, 68)">
  <!-- HTML / CSS -->
  <g transform="translate(0, 0)">
    <circle cx="6" cy="-4" r="5" fill="#e63946"/>
    <text x="18" y="0" class="lang-name">HTML &amp; CSS</text>
    <text x="310" y="0" class="lang-pct">42%</text>
    <rect x="0" y="8" width="310" height="8" rx="4" fill="#240c14"/>
    <rect class="bar" x="0" y="8" width="130" height="8" rx="4" fill="#e63946"/>
  </g>

  <!-- JavaScript -->
  <g transform="translate(0, 28)">
    <circle cx="6" cy="-4" r="5" fill="#ffd166"/>
    <text x="18" y="0" class="lang-name">JavaScript</text>
    <text x="310" y="0" class="lang-pct">35%</text>
    <rect x="0" y="8" width="310" height="8" rx="4" fill="#240c14"/>
    <rect class="bar" x="0" y="8" width="108" height="8" rx="4" fill="#ffd166"/>
  </g>

  <!-- TypeScript -->
  <g transform="translate(0, 56)">
    <circle cx="6" cy="-4" r="5" fill="#ff9f1c"/>
    <text x="18" y="0" class="lang-name">TypeScript / Three.js</text>
    <text x="310" y="0" class="lang-pct">18%</text>
    <rect x="0" y="8" width="310" height="8" rx="4" fill="#240c14"/>
    <rect class="bar" x="0" y="8" width="56" height="8" rx="4" fill="#ff9f1c"/>
  </g>

  <!-- Python -->
  <g transform="translate(0, 84)">
    <circle cx="6" cy="-4" r="5" fill="#ff6b35"/>
    <text x="18" y="0" class="lang-name">Python / Other</text>
    <text x="310" y="0" class="lang-pct">5%</text>
    <rect x="0" y="8" width="310" height="8" rx="4" fill="#240c14"/>
    <rect class="bar" x="0" y="8" width="16" height="8" rx="4" fill="#ff6b35"/>
  </g>
</g>
</svg>
