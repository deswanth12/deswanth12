<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="K Deswanth — Principal Software Developer &amp; Open Source Hunter">
<title>K Deswanth — Software Developer | Python, Flutter &amp; Open Source</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap');
text { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; }
.code-font { font-family: 'Fira Code', Consolas, monospace; }
.title-font { font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -1.5px; }

@keyframes floatHaptic { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes pulseAura { 0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 18px rgba(230, 57, 70, 0.4)); } 50% { opacity: 0.75; filter: drop-shadow(0 0 28px rgba(255, 209, 102, 0.6)); } }
@keyframes twinkleSoft { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 0.95; transform: scale(1.15); } }
@keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes holoSheen { 0% { transform: translateX(-320px) skewX(-22deg); } 42%, 100% { transform: translateX(400px) skewX(-22deg); } }
@keyframes crestGlow { 0%, 100% { filter: drop-shadow(0 0 6px rgba(230, 57, 70, 0.8)); } 50% { filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.9)); } }

.float-card { animation: floatHaptic 5.5s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
.star-twinkle { transform-box: fill-box; transform-origin: center; animation: twinkleSoft 3.5s ease-in-out infinite; }
.aura-pulse { animation: pulseAura 4.5s ease-in-out infinite; }
.cur { animation: cursorBlink 0.85s step-end infinite; }
.crest-pulse { animation: crestGlow 3.6s ease-in-out infinite; }
.holo-sweep { animation: holoSheen 5.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
.interactive-pill { transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1); }
.interactive-pill:hover { transform: translateY(-2px); }
]]></style>

<!-- Canvas & Bezel Gradients -->
<linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#120710"/>
  <stop offset="50%" stop-color="#0e040c"/>
  <stop offset="100%" stop-color="#070206"/>
</linearGradient>

<linearGradient id="outerBezelRing" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ffb5a7" stop-opacity="0.45"/>
  <stop offset="30%" stop-color="#ffd166" stop-opacity="0.25"/>
  <stop offset="70%" stop-color="#e63946" stop-opacity="0.3"/>
  <stop offset="100%" stop-color="#f8edeb" stop-opacity="0.1"/>
</linearGradient>

<linearGradient id="innerCoreStroke" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
</linearGradient>

<linearGradient id="heroTitleGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="55%" stop-color="#ffeedd"/>
  <stop offset="100%" stop-color="#ffb5a7"/>
</linearGradient>

<!-- Volumetric Lighting -->
<radialGradient id="meshGlowRuby" cx="20%" cy="30%" r="55%">
  <stop offset="0%" stop-color="#e63946" stop-opacity="0.14"/>
  <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
</radialGradient>

<radialGradient id="meshGlowAmber" cx="70%" cy="40%" r="60%">
  <stop offset="0%" stop-color="#ffd166" stop-opacity="0.15"/>
  <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
</radialGradient>

<!-- Hunter License Card Materials -->
<linearGradient id="hlCardBody" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#1c0915"/>
  <stop offset="35%" stop-color="#2a0c1e"/>
  <stop offset="70%" stop-color="#160611"/>
  <stop offset="100%" stop-color="#0d020a"/>
</linearGradient>

<linearGradient id="hlCardBezel" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ffd166"/>
  <stop offset="30%" stop-color="#ff3366"/>
  <stop offset="70%" stop-color="#e63946"/>
  <stop offset="100%" stop-color="#ffd166"/>
</linearGradient>

<linearGradient id="hlDiagonalSash" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#e63946" stop-opacity="0.42"/>
  <stop offset="100%" stop-color="#2a0d1f" stop-opacity="0.04"/>
</linearGradient>

<linearGradient id="hlChipGold" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#fff275"/>
  <stop offset="35%" stop-color="#ffd700"/>
  <stop offset="75%" stop-color="#c69214"/>
  <stop offset="100%" stop-color="#805b07"/>
</linearGradient>

<linearGradient id="hlFoilSweep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
  <stop offset="50%" stop-color="#ffd166" stop-opacity="0.26"/>
  <stop offset="60%" stop-color="#ff3366" stop-opacity="0.14"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<filter id="cardVolumetricShadow" x="-25%" y="-25%" width="150%" height="150%">
  <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e63946" flood-opacity="0.35"/>
  <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
</filter>

<clipPath id="hlCardClip">
  <rect x="546" y="116" width="276" height="178" rx="14"/>
</clipPath>

<!-- Micro Dot Grid Pattern -->
<pattern id="microGrid" width="20" height="20" patternUnits="userSpaceOnUse">
