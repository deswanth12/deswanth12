<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 740" width="1280" height="740" role="img" aria-label="Deswanth - SSS Class Flame Hashira Frontend Developer">
<title>Deswanth — SSS Class Flame Hashira Frontend Developer</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Outfit:wght@500;700;900&display=swap');
text { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
.hero-title { font-family: 'Outfit', sans-serif; font-weight: 900; }

@keyframes popIn { 0% { opacity: 0; transform: translateY(20px) scale(.85); } 70% { opacity: 1; transform: translateY(-4px) scale(1.04); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes spinRingRev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
@keyframes flamePulse { 0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 159, 28, 0.7)) drop-shadow(0 0 40px rgba(230, 57, 70, 0.5)); } 50% { filter: drop-shadow(0 0 35px rgba(255, 209, 102, 0.9)) drop-shadow(0 0 60px rgba(255, 107, 53, 0.7)); } }
@keyframes sparkTwinkle { 0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1.4) rotate(45deg); } }
@keyframes emberRise { 0% { transform: translateY(0) translateX(0); opacity: 0; } 20% { opacity: 0.9; } 80% { opacity: 0.9; } 100% { transform: translateY(-110px) translateX(30px); opacity: 0; } }

.pill { transition: transform .25s ease, filter .25s ease; transform-box: fill-box; transform-origin: center; cursor: pointer; }
.pill:hover { transform: scale(1.12); filter: brightness(1.35); }
.cur { animation: blink 0.9s step-end infinite; }
.spark { transform-box: fill-box; transform-origin: center; animation: sparkTwinkle 2.6s ease-in-out infinite; }
.flame-bg { animation: flamePulse 4s ease-in-out infinite; }
.float-1 { animation: floaty 4.5s ease-in-out infinite; }
.ember { animation: emberRise 3.8s linear infinite; }
.ring-spin { transform-box: fill-box; transform-origin: center; animation: spinRing 12s linear infinite; }
.ring-spin-rev { transform-box: fill-box; transform-origin: center; animation: spinRingRev 16s linear infinite; }
]]></style>

<!-- Gradients & Filters -->
<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0b0406"/>
  <stop offset="40%" stop-color="#18090d"/>
  <stop offset="100%" stop-color="#240c14"/>
</linearGradient>

<radialGradient id="flameGlowCenter" cx="60%" cy="40%" r="55%">
  <stop offset="0%" stop-color="#ff9f1c" stop-opacity="0.32"/>
  <stop offset="50%" stop-color="#e63946" stop-opacity="0.16"/>
  <stop offset="100%" stop-color="#0b0406" stop-opacity="0"/>
</radialGradient>

<linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffd166"/>
  <stop offset="40%" stop-color="#ff9f1c"/>
  <stop offset="80%" stop-color="#ff6b35"/>
  <stop offset="100%" stop-color="#e63946"/>
</linearGradient>

<linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff9f1c"/>
  <stop offset="33%" stop-color="#ffd166"/>
  <stop offset="66%" stop-color="#e63946"/>
  <stop offset="100%" stop-color="#ff6b35"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Circular Clip for Avatar Photo -->
<clipPath id="avatarClip">
  <circle cx="100" cy="100" r="92"/>
</clipPath>
</defs>

<!-- Outer Container -->
<rect width="1280" height="740" rx="24" fill="url(#bgGrad)"/>
<rect width="1276" height="736" x="2" y="2" rx="23" fill="none" stroke="url(#cardBorder)" stroke-width="2.5" opacity="0.85"/>

<!-- Background Glow -->
<circle cx="750" cy="300" r="380" fill="url(#flameGlowCenter)"/>

<!-- Geometric Tech Grid Background -->
<g opacity="0.06" stroke="#ffd166" stroke-width="1">
  <path d="M0 100 H1280 M0 200 H1280 M0 300 H1280 M0 400 H1280 M0 500 H1280 M0 600 H1280 M0 700 H1280"/>
  <path d="M100 0 V740 M200 0 V740 M300 0 V740 M400 0 V740 M500 0 V740 M600 0 V740 M700 0 V740 M800 0 V740 M900 0 V740 M1000 0 V740 M1100 0 V740 M1200 0 V740"/>
</g>

<!-- Animated Rising Flame Embers -->
<g class="ember" style="animation-delay: 0.1s;"><circle cx="120" cy="640" r="3" fill="#ffd166" opacity="0.9"/></g>
<g class="ember" style="animation-delay: 1.2s;"><circle cx="260" cy="690" r="4.5" fill="#ff9f1c" opacity="0.95"/></g>
<g class="ember" style="animation-delay: 2.4s;"><circle cx="480" cy="650" r="3" fill="#e63946" opacity="0.85"/></g>
<g class="ember" style="animation-delay: 0.8s;"><circle cx="740" cy="670" r="4" fill="#ffd166" opacity="0.9"/></g>
<g class="ember" style="animation-delay: 1.9s;"><circle cx="980" cy="680" r="3.5" fill="#ff6b35" opacity="0.9"/></g>
<g class="ember" style="animation-delay: 2.7s;"><circle cx="1160" cy="630" r="2.5" fill="#ff9f1c" opacity="0.8"/></g>

<!-- Sparkles -->
<g class="spark" style="animation-delay: 0.3s;"><path d="M100 130 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#ffd166"/></g>
<g class="spark" style="animation-delay: 1.6s;"><path d="M1180 140 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#ff9f1c"/></g>

<!-- Top Status Header Badge -->
<g transform="translate(70, 68)">
  <rect width="320" height="42" rx="21" fill="#1f0a12" stroke="#ff9f1c" stroke-width="1.5"/>
  <circle cx="24" cy="21" r="6" fill="#e63946">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="26" fill="#ffd166" font-size="13" font-weight="700" letter-spacing="1">🔥 SSS-CLASS FLAME HASHIRA MODE</text>
</g>

<!-- Main Left Headline Section -->
<g transform="translate(70, 210)">
  <text class="hero-title flame-bg" x="0" y="0" font-size="82" fill="url(#titleGrad)" filter="url(#glow)">DESWANTH</text>
  
  <g transform="translate(0, 48)">
    <text x="0" y="0" fill="#f5eaec" font-size="24" font-weight="600" letter-spacing="0.5">
      Frontend Architect &amp; Anime Web Craftsman ⚔️
    </text>
  </g>
  
  <!-- Motto Box -->
  <g transform="translate(0, 92)">
    <rect width="560" height="52" rx="12" fill="#18070d" stroke="#e63946" stroke-width="1.5" opacity="0.9"/>
    <text x="20" y="32" fill="#ffd166" font-size="16" font-style="italic">
      🔥 &quot;Set your heart ablaze — code with untamed passion!&quot;
    </text>
  </g>
</g>

<!-- Center Avatar Portrait Artwork Frame (Deswanth's Photo) -->
<g transform="translate(670, 150)" class="float-1">
  <!-- Glowing Flame Aura Ring behind Portrait -->
  <circle cx="100" cy="100" r="115" fill="none" stroke="url(#titleGrad)" stroke-width="3" stroke-dasharray="14,8" class="ring-spin" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="105" fill="none" stroke="#ff6b35" stroke-width="2" stroke-dasharray="6,6" class="ring-spin-rev"/>
  
  <!-- Outer Gold Rim -->
  <circle cx="100" cy="100" r="96" fill="#240c14" stroke="#ffd166" stroke-width="4" filter="url(#glow)"/>

  <!-- Deswanth Photo Image -->
  <g clip-path="url(#avatarClip)">
    <image href="./deswanth-avatar.png" xlink:href="https://raw.githubusercontent.com/deswanth12/deswanth12/main/deswanth-avatar.png" x="0" y="-15" width="200" height="230" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Rank Badge Overlay on Photo -->
  <g transform="translate(100, 185)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1a080e" stroke="#ff9f1c" stroke-width="1.5"/>
    <text x="0" y="4" fill="#ffd166" font-size="12" font-weight="700" text-anchor="middle">⚡ DESWANTH ⚡</text>
  </g>
</g>

<!-- Right Side Code Terminal Frame -->
<g transform="translate(900, 110)">
  <rect width="320" height="470" rx="16" fill="#120509" stroke="url(#cardBorder)" stroke-width="2" filter="url(#glow)"/>
  
  <path d="M900 126 a16 16 0 0 1 16 -16 h288 a16 16 0 0 1 16 16 v28 h-320 z" fill="#200a12"/>
  <circle cx="20" cy="20" r="6" fill="#e63946"/>
  <circle cx="38" cy="20" r="6" fill="#ff9f1c"/>
  <circle cx="56" cy="20" r="6" fill="#ffd166"/>
  <text x="160" y="24" fill="#8c7379" font-size="12" text-anchor="middle">deswanth_core.ts</text>
  
  <g transform="translate(20, 62)">
    <text x="0" y="20" fill="#e63946" font-size="13">&gt; const deswanth = {</text>
    <text x="16" y="45" fill="#ff9f1c" font-size="13">user: <tspan fill="#ffd166">&quot;deswanth12&quot;</tspan>,</text>
    <text x="16" y="70" fill="#ff9f1c" font-size="13">role: <tspan fill="#ffd166">&quot;Frontend Dev ⚔️&quot;</tspan>,</text>
    <text x="16" y="95" fill="#ff9f1c" font-size="13">rank: <tspan fill="#ffd166">&quot;SSS Hashira 🔥&quot;</tspan>,</text>
    <text x="16" y="120" fill="#ff9f1c" font-size="13">creations: [</text>
    <text x="32" y="145" fill="#ffd166" font-size="12">&quot;Naruto Sage Mode&quot;,</text>
    <text x="32" y="170" fill="#ffd166" font-size="12">&quot;Zoro King of Hell&quot;,</text>
    <text x="32" y="195" fill="#ffd166" font-size="12">&quot;Demon Slayer Art&quot;,</text>
    <text x="32" y="220" fill="#ffd166" font-size="12">&quot;One Piece 3D&quot;</text>
    <text x="16" y="245" fill="#ff9f1c" font-size="13">],</text>
    <text x="16" y="270" fill="#ff9f1c" font-size="13">power: <tspan fill="#ffd166">&quot;Over 9000 ⚡&quot;</tspan></text>
    <text x="0" y="295" fill="#e63946" font-size="13">};</text>

    <text x="0" y="335" fill="#ffd166" font-size="12">deswanth@flame:~ $ <tspan fill="#ff9f1c">build</tspan></text>
    <text x="0" y="365" fill="#e63946" font-size="12">✔ 100% Mindblowing Art <tspan class="cur" fill="#ffd166">█</tspan></text>
  </g>
</g>

<!-- Bottom Arsenal Tech Stack Badges -->
<g transform="translate(70, 425)">
  <text x="0" y="0" fill="#a48c92" font-size="13" font-weight="700" letter-spacing="2">PRIMARY ARSENAL</text>

  <g transform="translate(0, 20)">
    <g class="pill" transform="translate(0, 0)">
      <rect width="125" height="38" rx="19" fill="#240c14" stroke="#ff9f1c" stroke-width="1.5"/>
      <text x="62" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">HTML5 / CSS3</text>
    </g>
    <g class="pill" transform="translate(140, 0)">
      <rect width="120" height="38" rx="19" fill="#240c14" stroke="#ffd166" stroke-width="1.5"/>
      <text x="60" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">JavaScript</text>
    </g>
    <g class="pill" transform="translate(275, 0)">
      <rect width="120" height="38" rx="19" fill="#240c14" stroke="#ff6b35" stroke-width="1.5"/>
      <text x="60" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">TypeScript</text>
    </g>
    <g class="pill" transform="translate(410, 0)">
      <rect width="105" height="38" rx="19" fill="#240c14" stroke="#e63946" stroke-width="1.5"/>
      <text x="52" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">React.js</text>
    </g>
    <g class="pill" transform="translate(530, 0)">
      <rect width="105" height="38" rx="19" fill="#240c14" stroke="#ff9f1c" stroke-width="1.5"/>
      <text x="52" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">Three.js</text>
    </g>
    <g class="pill" transform="translate(650, 0)">
      <rect width="120" height="38" rx="19" fill="#240c14" stroke="#ffd166" stroke-width="1.5"/>
      <text x="60" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">TailwindCSS</text>
    </g>
  </g>
</g>

<!-- Footer Quick Social Links -->
<g transform="translate(70, 580)">
  <g class="pill" transform="translate(0, 0)">
    <rect width="160" height="42" rx="10" fill="#240c14" stroke="#ff9f1c" stroke-width="1.5"/>
    <text x="80" y="26" fill="#ffd166" font-size="14" font-weight="600" text-anchor="middle">🐙 GITHUB PROFILE</text>
  </g>
</g>

</svg>
