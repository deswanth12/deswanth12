<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 740" width="1280" height="740" role="img" aria-label="Deswanth - Flame Hashira Frontend Developer">
<title>Deswanth — Flame Hashira Frontend Developer</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Outfit:wght@500;700;900&display=swap');
text { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
.hero-title { font-family: 'Outfit', sans-serif; font-weight: 900; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { 0% { opacity: 0; transform: translateY(18px) scale(.85); } 70% { opacity: 1; transform: translateY(-4px) scale(1.04); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes floaty2 { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(5deg); } }
@keyframes flamePulse { 0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 159, 28, 0.6)) drop-shadow(0 0 30px rgba(230, 57, 70, 0.4)); } 50% { filter: drop-shadow(0 0 25px rgba(255, 209, 102, 0.8)) drop-shadow(0 0 45px rgba(255, 107, 53, 0.6)); } }
@keyframes sparkTwinkle { 0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1.3) rotate(45deg); } }
@keyframes emberRise { 0% { transform: translateY(0) translateX(0); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.8; } 100% { transform: translateY(-90px) translateX(25px); opacity: 0; } }

.ltr { opacity: 0; animation: popIn .5s cubic-bezier(.2,.8,.3,1.3) forwards; transform-box: fill-box; transform-origin: center bottom; }
.pill { transition: transform .25s ease, filter .25s ease; transform-box: fill-box; transform-origin: center; cursor: pointer; }
.pill:hover { transform: scale(1.1); filter: brightness(1.3); }
.cur { animation: blink 0.9s step-end infinite; }
.spark { transform-box: fill-box; transform-origin: center; animation: sparkTwinkle 2.8s ease-in-out infinite; }
.flame-bg { animation: flamePulse 4s ease-in-out infinite; }
.float-1 { animation: floaty 4.5s ease-in-out infinite; }
.float-2 { transform-box: fill-box; transform-origin: center; animation: floaty2 5s ease-in-out infinite; }
.ember { animation: emberRise 3.5s linear infinite; }
]]></style>

<!-- Gradients & Filters -->
<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0d0608"/>
  <stop offset="50%" stop-color="#180a0e"/>
  <stop offset="100%" stop-color="#240c12"/>
</linearGradient>

<radialGradient id="flameGlow1" cx="20%" cy="30%" r="60%">
  <stop offset="0%" stop-color="#ff9f1c" stop-opacity="0.35"/>
  <stop offset="50%" stop-color="#e63946" stop-opacity="0.15"/>
  <stop offset="100%" stop-color="#0d0608" stop-opacity="0"/>
</radialGradient>

<radialGradient id="flameGlow2" cx="80%" cy="70%" r="50%">
  <stop offset="0%" stop-color="#ffd166" stop-opacity="0.25"/>
  <stop offset="60%" stop-color="#ff6b35" stop-opacity="0.10"/>
  <stop offset="100%" stop-color="#0d0608" stop-opacity="0"/>
</radialGradient>

<linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffd166"/>
  <stop offset="50%" stop-color="#ff9f1c"/>
  <stop offset="100%" stop-color="#e63946"/>
</linearGradient>

<linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff9f1c"/>
  <stop offset="50%" stop-color="#e63946"/>
  <stop offset="100%" stop-color="#ffd166"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
</defs>

<!-- Outer Container -->
<rect width="1280" height="740" rx="24" fill="url(#bgGrad)"/>
<rect width="1276" height="736" x="2" y="2" rx="23" fill="none" stroke="url(#cardBorder)" stroke-width="2" opacity="0.8"/>

<!-- Background Glow Spheres -->
<circle cx="250" cy="220" r="320" fill="url(#flameGlow1)"/>
<circle cx="1020" cy="520" r="350" fill="url(#flameGlow2)"/>

<!-- Grid Line Pattern -->
<g opacity="0.05" stroke="#ffd166" stroke-width="1">
  <path d="M0 100 H1280 M0 200 H1280 M0 300 H1280 M0 400 H1280 M0 500 H1280 M0 600 H1280 M0 700 H1280"/>
  <path d="M100 0 V740 M200 0 V740 M300 0 V740 M400 0 V740 M500 0 V740 M600 0 V740 M700 0 V740 M800 0 V740 M900 0 V740 M1000 0 V740 M1100 0 V740 M1200 0 V740"/>
</g>

<!-- Animated Flame Embers -->
<g class="ember" style="animation-delay: 0.2s;"><circle cx="150" cy="620" r="3" fill="#ffd166" opacity="0.8"/></g>
<g class="ember" style="animation-delay: 1.1s;"><circle cx="280" cy="680" r="4.5" fill="#ff9f1c" opacity="0.9"/></g>
<g class="ember" style="animation-delay: 2.3s;"><circle cx="420" cy="640" r="2.5" fill="#e63946" opacity="0.7"/></g>
<g class="ember" style="animation-delay: 0.7s;"><circle cx="850" cy="660" r="4" fill="#ffd166" opacity="0.85"/></g>

<!-- Decorative Sparkles -->
<g class="spark" style="animation-delay: 0.4s;"><path d="M120 140 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#ffd166"/></g>
<g class="spark" style="animation-delay: 1.5s;"><path d="M1160 160 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#ff9f1c"/></g>

<!-- Top Status Badge Header -->
<g transform="translate(80, 75)">
  <rect width="270" height="42" rx="21" fill="#1f0c13" stroke="#ff9f1c" stroke-width="1.5" opacity="0.9"/>
  <circle cx="24" cy="21" r="6" fill="#e63946">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="26" fill="#ffd166" font-size="14" font-weight="600" letter-spacing="1">🔥 FLAME HASHIRA MODE</text>
</g>

<!-- Main Headline Section (Deswanth) -->
<g transform="translate(80, 220)">
  <text class="hero-title flame-bg" x="0" y="0" font-size="78" fill="url(#titleGrad)" filter="url(#glow)">DESWANTH</text>
  
  <g transform="translate(0, 48)">
    <text x="0" y="0" fill="#f0e6e8" font-size="24" font-weight="600" letter-spacing="0.5">
      Frontend Developer &amp; Anime Craftsman ⚔️
    </text>
  </g>
  
  <g transform="translate(0, 95)">
    <rect width="680" height="50" rx="12" fill="#1a090e" stroke="#e63946" stroke-width="1" opacity="0.85"/>
    <text x="20" y="31" fill="#ffd166" font-size="16" font-style="italic">
      🔥 &quot;Set your heart ablaze — code with untamed passion!&quot;
    </text>
  </g>
</g>

<!-- Tech Stack Badges Section -->
<g transform="translate(80, 435)">
  <text x="0" y="0" fill="#a08a90" font-size="14" font-weight="700" letter-spacing="2">PRIMARY ARSENAL</text>

  <g transform="translate(0, 20)">
    <g class="pill" transform="translate(0, 0)">
      <rect width="125" height="38" rx="19" fill="#240c14" stroke="#ff9f1c" stroke-width="1.5"/>
      <text x="62" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">HTML5 / CSS3</text>
    </g>
    <g class="pill" transform="translate(140, 0)">
      <rect width="120" height="38" rx="19" fill="#240c14" stroke="#ffd166" stroke-width="1.5"/>
      <text x="60" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">JavaScript</text>
    </g>
    <g class="pill" transform="translate(275, 0)">
      <rect width="120" height="38" rx="19" fill="#240c14" stroke="#ff6b35" stroke-width="1.5"/>
      <text x="60" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">TypeScript</text>
    </g>
    <g class="pill" transform="translate(410, 0)">
      <rect width="105" height="38" rx="19" fill="#240c14" stroke="#e63946" stroke-width="1.5"/>
      <text x="52" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">React.js</text>
    </g>
    <g class="pill" transform="translate(530, 0)">
      <rect width="105" height="38" rx="19" fill="#240c14" stroke="#ff9f1c" stroke-width="1.5"/>
      <text x="52" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">Three.js</text>
    </g>
    <g class="pill" transform="translate(650, 0)">
      <rect width="120" height="38" rx="19" fill="#240c14" stroke="#ffd166" stroke-width="1.5"/>
      <text x="60" y="24" fill="#ffd166" font-size="13" font-weight="600" text-anchor="middle">TailwindCSS</text>
    </g>
  </g>
</g>

<!-- Terminal Output Simulation Frame -->
<g transform="translate(840, 120)" class="float-1">
  <rect width="360" height="480" rx="16" fill="#14070a" stroke="url(#cardBorder)" stroke-width="2" filter="url(#glow)"/>
  
  <path d="M840 136 a16 16 0 0 1 16 -16 h328 a16 16 0 0 1 16 16 v28 h-360 z" fill="#240c12"/>
  <circle cx="24" cy="20" r="6" fill="#e63946"/>
  <circle cx="44" cy="20" r="6" fill="#ff9f1c"/>
  <circle cx="64" cy="20" r="6" fill="#ffd166"/>
  <text x="180" y="24" fill="#8a7378" font-size="12" text-anchor="middle">flame_core.ts</text>
  
  <g transform="translate(24, 65)">
    <text x="0" y="20" fill="#e63946" font-size="13">&gt; const developer = {</text>
    <text x="20" y="45" fill="#ff9f1c" font-size="13">name: <tspan fill="#ffd166">&quot;Deswanth&quot;</tspan>,</text>
    <text x="20" y="70" fill="#ff9f1c" font-size="13">github: <tspan fill="#ffd166">&quot;deswanth12&quot;</tspan>,</text>
    <text x="20" y="95" fill="#ff9f1c" font-size="13">mode: <tspan fill="#ffd166">&quot;Flame Hashira 🔥&quot;</tspan>,</text>
    <text x="20" y="120" fill="#ff9f1c" font-size="13">creations: [</text>
    <text x="40" y="145" fill="#ffd166" font-size="13">&quot;Naruto Sage Mode&quot;,</text>
    <text x="40" y="170" fill="#ffd166" font-size="13">&quot;Zoro King of Hell&quot;,</text>
    <text x="40" y="195" fill="#ffd166" font-size="13">&quot;Demon Slayer Yoriichi&quot;,</text>
    <text x="40" y="220" fill="#ffd166" font-size="13">&quot;One Piece 3D&quot;</text>
    <text x="20" y="245" fill="#ff9f1c" font-size="13">],</text>
    <text x="20" y="270" fill="#ff9f1c" font-size="13">status: <tspan fill="#ffd166">&quot;Building Web Magic&quot;</tspan></text>
    <text x="0" y="295" fill="#e63946" font-size="13">};</text>

    <text x="0" y="340" fill="#ffd166" font-size="13">flame@core:~ $ <tspan fill="#ff9f1c">npm run build:art</tspan></text>
    <text x="0" y="370" fill="#e63946" font-size="13">✔ Rendered with 100% Passion <tspan class="cur" fill="#ffd166">█</tspan></text>
  </g>
</g>

<!-- Footer Quick Social Links -->
<g transform="translate(80, 580)">
  <g class="pill" transform="translate(0, 0)">
    <rect width="140" height="42" rx="10" fill="#240c14" stroke="#e63946" stroke-width="1.5"/>
    <text x="70" y="26" fill="#ffd166" font-size="14" font-weight="600" text-anchor="middle">📧 EMAIL ME</text>
  </g>

  <g class="pill" transform="translate(160, 0)">
    <rect width="150" height="42" rx="10" fill="#240c14" stroke="#ff9f1c" stroke-width="1.5"/>
    <text x="75" y="26" fill="#ffd166" font-size="14" font-weight="600" text-anchor="middle">🐙 GITHUB REPOS</text>
  </g>
</g>

</svg>
