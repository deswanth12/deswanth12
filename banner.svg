<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="K Deswanth — Software Developer | Python, Flutter &amp; Open Source">
<title>K Deswanth — Software Developer | Python, Flutter &amp; Open Source</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap');
text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.code-font { font-family: 'Fira Code', Consolas, Monaco, monospace; }
.title-font { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; letter-spacing: -2px; }

@keyframes auraBreathe { 0%, 100% { opacity: 0.35; transform: scale(0.96); } 50% { opacity: 0.7; transform: scale(1.05); } }
@keyframes crestRotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes crestCounterRotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
@keyframes sheenSweep { 0% { transform: translateX(-160px) skewX(-20deg); } 40%, 100% { transform: translateX(200px) skewX(-20deg); } }
@keyframes starTwinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 0.85; transform: scale(1.2); } }

.aura-anim { transform-origin: 940px 180px; animation: auraBreathe 6s ease-in-out infinite; }
.ring-spin { transform-origin: 940px 180px; animation: crestRotateSlow 45s linear infinite; }
.ring-reverse { transform-origin: 940px 180px; animation: crestCounterRotate 60s linear infinite; }
.sheen-anim { animation: sheenSweep 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
.star-anim { transform-box: fill-box; transform-origin: center; animation: starTwinkle 4s ease-in-out infinite; }
]]></style>

<!-- Background Canvas & Lighting Gradients -->
<linearGradient id="linearCanvasBg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0c070e"/>
  <stop offset="45%" stop-color="#09050b"/>
  <stop offset="100%" stop-color="#050207"/>
</linearGradient>

<linearGradient id="machinedOuterRim" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
  <stop offset="25%" stop-color="#ffd166" stop-opacity="0.25"/>
  <stop offset="60%" stop-color="#e63946" stop-opacity="0.2"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
</linearGradient>

<linearGradient id="innerCoreHairline" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
</linearGradient>

<!-- Hero Title Linear Gradient -->
<linearGradient id="linearHeroTitle" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="45%" stop-color="#ffffff"/>
  <stop offset="75%" stop-color="#fcd5ce"/>
  <stop offset="100%" stop-color="#ffd166"/>
</linearGradient>

<!-- Ambient Radial Glows -->
<radialGradient id="rubyRadialMesh" cx="15%" cy="35%" r="65%">
  <stop offset="0%" stop-color="#e63946" stop-opacity="0.12"/>
  <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
</radialGradient>

<radialGradient id="amberRadialMesh" cx="80%" cy="50%" r="55%">
  <stop offset="0%" stop-color="#ffd166" stop-opacity="0.14"/>
  <stop offset="60%" stop-color="#e63946" stop-opacity="0.05"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<!-- Metallic Emblem Gradients -->
<linearGradient id="metallicGold" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#fff4b8"/>
  <stop offset="25%" stop-color="#ffd166"/>
  <stop offset="55%" stop-color="#d49b20"/>
  <stop offset="85%" stop-color="#8c5b07"/>
  <stop offset="100%" stop-color="#ffd166"/>
</linearGradient>

<linearGradient id="metallicCrimson" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff6b7a"/>
  <stop offset="40%" stop-color="#e63946"/>
  <stop offset="80%" stop-color="#8a1420"/>
  <stop offset="100%" stop-color="#4a050d"/>
</linearGradient>

<linearGradient id="metallicBezelRing" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ffd166" stop-opacity="0.8"/>
  <stop offset="30%" stop-color="#ffffff" stop-opacity="0.9"/>
  <stop offset="70%" stop-color="#e63946" stop-opacity="0.7"/>
  <stop offset="100%" stop-color="#d49b20" stop-opacity="0.8"/>
</linearGradient>

<linearGradient id="emblemSheenGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<!-- Volumetric Drop Shadow for Emblem -->
<filter id="emblemVolumetricShadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#e63946" flood-opacity="0.45"/>
  <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
</filter>

<clipPath id="emblemClip">
  <circle cx="940" cy="180" r="76"/>
</clipPath>

<!-- Micro Dot Grid -->
<pattern id="dotGridLinear" width="24" height="24" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="0.75" fill="#ffffff" fill-opacity="0.04"/>
</pattern>
</defs>

<!-- LAYER 0: Canvas Base & Machined Double-Bezel -->
<rect width="1200" height="360" rx="20" fill="url(#linearCanvasBg)"/>
<rect width="1200" height="360" rx="20" fill="url(#dotGridLinear)"/>
<rect width="1196" height="356" x="2" y="2" rx="18" fill="none" stroke="url(#machinedOuterRim)" stroke-width="1.4"/>
<rect width="1190" height="350" x="5" y="5" rx="15" fill="none" stroke="url(#innerCoreHairline)" stroke-width="0.9"/>

<!-- LAYER 1: Ambient Mesh Luminescence -->
<rect width="1200" height="360" rx="20" fill="url(#rubyRadialMesh)"/>
<rect width="1200" height="360" rx="20" fill="url(#amberRadialMesh)"/>

<!-- LAYER 2: Minimal Star Accents -->
<g class="star-anim" style="animation-delay: 0.3s;"><text x="82" y="54" fill="#ffd166" font-size="12">✦</text></g>
<g class="star-anim" style="animation-delay: 1.6s;"><text x="730" y="70" fill="#fcd5ce" font-size="10">✧</text></g>
<g class="star-anim" style="animation-delay: 2.5s;"><text x="1120" y="60" fill="#ffd166" font-size="12">✦</text></g>
<g class="star-anim" style="animation-delay: 1.1s;"><text x="680" y="324" fill="#fcd5ce" font-size="11">✦</text></g>

<!-- ========================================================= -->
<!-- LEFT COLUMN: Identity, Linear Typography & Telemetry     -->
<!-- ========================================================= -->
<g transform="translate(80, 0)">

  <!-- Micro Eyebrow Pill -->
  <g transform="translate(0, 56)">
    <rect width="288" height="26" rx="13" fill="#180a15" stroke="url(#machinedOuterRim)" stroke-width="1"/>
    <rect width="284" height="22" x="2" y="2" rx="11" fill="#10050e" stroke="url(#innerCoreHairline)" stroke-width="0.8"/>
    <!-- Glowing Status Beacon -->
    <circle cx="14" cy="13" r="3.5" fill="#ffd166"/>
    <circle cx="14" cy="13" r="6" fill="#ffd166" fill-opacity="0.25"/>
    <text class="code-font" x="26" y="17" fill="#ffd166" font-size="10" font-weight="700" letter-spacing="1.4">HUNTER LICENSE // № 2026-1017</text>
  </g>

  <!-- Giant Hero Title (Precision Spacing) -->
  <text class="title-font" x="0" y="148" font-size="64" fill="url(#linearHeroTitle)">K DESWANTH</text>

  <!-- Role Subtitle with Micro Delimiters -->
  <g transform="translate(2, 186)">
    <text x="0" y="0" fill="#fcd5ce" font-size="20" font-weight="700" letter-spacing="0.2">Software Developer</text>
    <text class="code-font" x="194" y="-1" fill="#e63946" font-size="15" font-weight="700">·</text>
    <text x="210" y="0" fill="#ffd166" font-size="19" font-weight="600">Python, Flutter &amp; Open Source</text>
  </g>

  <!-- Minimal Linear Tech Pills -->
  <g transform="translate(0, 222)">
    <!-- Pill 1: DevTools -->
    <g transform="translate(0, 0)">
      <rect width="144" height="32" rx="8" fill="#180a15" stroke="#fcd5ce" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="3" fill="#e63946"/>
      <text class="code-font" x="26" y="20" fill="#fcd5ce" font-size="11.5" font-weight="600">DevTools (AST)</text>
    </g>

    <!-- Pill 2: Privacy Architecture -->
    <g transform="translate(156, 0)">
      <rect width="176" height="32" rx="8" fill="#180a15" stroke="#ffd166" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="3" fill="#ffd166"/>
      <text class="code-font" x="26" y="20" fill="#ffd166" font-size="11.5" font-weight="600">Privacy Architecture</text>
    </g>

    <!-- Pill 3: Open Source -->
    <g transform="translate(344, 0)">
      <rect width="180" height="32" rx="8" fill="#180a15" stroke="#ffb5a7" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="3" fill="#ffb5a7"/>
      <text class="code-font" x="26" y="20" fill="#ffb5a7" font-size="11.5" font-weight="600">Open-Source Hunter</text>
    </g>
  </g>

  <!-- Micro Location & Philosophy Bar -->
  <g transform="translate(2, 290)">
    <line x1="0" y1="2" x2="0" y2="18" stroke="#e63946" stroke-width="2" stroke-linecap="round"/>
    <text class="code-font" x="12" y="14" fill="#a88c95" font-size="12" font-weight="500">📍 Tirupati, India  <tspan fill="#e63946">·</tspan>  &quot;Code with kindness, test thoroughly, keep it clean&quot;</text>
  </g>
</g>

<!-- ========================================================= -->
<!-- RIGHT COLUMN: Refined Metallic Hunter Emblem &amp; Pedestal  -->
<!-- High-End Machined Seal with Celestial Orbital Rings       -->
<!-- ========================================================= -->
<g>
  <!-- Ambient Volumetric Aura Glow -->
  <circle class="aura-anim" cx="940" cy="172" r="95" fill="#e63946" opacity="0.38" filter="blur(26px)"/>
  <circle class="aura-anim" cx="940" cy="172" r="65" fill="#ffd166" opacity="0.30" filter="blur(18px)"/>

  <!-- Rotating Celestial Outer Orbital Ring -->
  <g class="ring-spin">
    <circle cx="940" cy="172" r="112" fill="none" stroke="#ffd166" stroke-width="1.2" stroke-dasharray="3,12" stroke-opacity="0.45"/>
    <circle cx="940" cy="172" r="124" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="1,24" stroke-opacity="0.25"/>
    <!-- Orbit Cardinal Pips -->
    <circle cx="940" cy="60" r="2.5" fill="#ffd166"/>
    <circle cx="940" cy="284" r="2.5" fill="#ffd166"/>
    <circle cx="828" cy="172" r="2.5" fill="#e63946"/>
    <circle cx="1052" cy="172" r="2.5" fill="#e63946"/>
  </g>

  <!-- Counter-Rotating Inner Ring with Degree Ticks -->
  <g class="ring-reverse">
    <circle cx="940" cy="172" r="92" fill="none" stroke="#ffb5a7" stroke-width="0.9" stroke-dasharray="8,6" stroke-opacity="0.35"/>
  </g>

  <!-- Main Machined Emblem Body -->
  <g filter="url(#emblemVolumetricShadow)">
    <!-- Base Medallion Shell -->
    <circle cx="940" cy="172" r="76" fill="#150711" stroke="url(#metallicBezelRing)" stroke-width="2.2"/>
    <circle cx="940" cy="172" r="72" fill="#0d030a" stroke="url(#innerCoreHairline)" stroke-width="1"/>

    <!-- Subtle Radial Guilloché / Radial Lines -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.8">
      <line x1="940" y1="102" x2="940" y2="242"/>
      <line x1="870" y1="172" x2="1010" y2="172"/>
      <line x1="890" y1="122" x2="990" y2="222"/>
      <line x1="890" y1="222" x2="990" y2="122"/>
    </g>

    <!-- Authentic Hunter Association Wings (Left & Right Crescents) -->
    <g transform="translate(940, 172)">
      <!-- Left Crescent Blade (Metallic Gradient) -->
      <path d="M -12,-34 C -36,-18 -36,18 -12,34 C -22,18 -22,-18 -12,-34 Z" fill="url(#metallicCrimson)" stroke="url(#metallicGold)" stroke-width="1.4"/>
      
      <!-- Right Crescent Blade (Metallic Gradient) -->
      <path d="M 12,-34 C 36,-18 36,18 12,34 C 22,18 22,-18 12,-34 Z" fill="url(#metallicCrimson)" stroke="url(#metallicGold)" stroke-width="1.4"/>

      <!-- Center Star & Diamond Core -->
      <!-- Outer Diamond -->
      <polygon points="0,-18 8,-3 0,12 -8,-3" fill="url(#metallicGold)" stroke="#ffffff" stroke-width="0.8"/>
      <!-- Inner Brilliant Facet -->
      <polygon points="0,-13 5,-3 0,8 -5,-3" fill="#ffffff" fill-opacity="0.9"/>
      <circle cx="0" cy="-3" r="2.2" fill="#8c5b07"/>

      <!-- Horizontal Meridian Line -->
      <line x1="-38" y1="-3" x2="38" y2="-3" stroke="url(#metallicGold)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="-38" cy="-3" r="1.8" fill="#ffd166"/>
      <circle cx="38" cy="-3" r="1.8" fill="#ffd166"/>
    </g>

    <!-- Foil Holographic Sheen Sweep (Clipped) -->
    <g clip-path="url(#emblemClip)">
      <rect class="sheen-anim" x="840" y="96" width="70" height="152" fill="url(#emblemSheenGrad)"/>
    </g>
  </g>

  <!-- Typography Below Emblem: Executive Credential -->
  <g transform="translate(940, 276)" text-anchor="middle">
    <!-- Outer Status Pill -->
    <rect x="-82" y="-12" width="164" height="24" rx="12" fill="#150711" stroke="url(#machinedOuterRim)" stroke-width="0.9"/>
    <!-- Micro Tag -->
    <text class="code-font" x="0" y="4" fill="#ffd166" font-size="9" font-weight="700" letter-spacing="1.6">PRO HUNTER · VERIFIED</text>
    <text class="code-font" x="0" y="24" fill="#a88c95" font-size="7.5" font-weight="600" letter-spacing="1.8">ハンター協会 • SINGLE-STAR</text>
  </g>
</g>

</svg>