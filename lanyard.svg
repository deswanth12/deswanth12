<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 660" width="420" height="660" role="img" aria-label="Deswanth Flame Hashira ID Card Lanyard">
<title>Deswanth — Flame Hashira Swinging ID Badge</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Outfit:wght@600;800;900&display=swap');
text { font-family: 'Fira Code', Consolas, monospace; }
.card-name { font-family: 'Outfit', sans-serif; font-weight: 900; }

@keyframes settle { 0% { transform: rotate(0deg) translateY(-660px); } 18% { transform: rotate(0deg) translateY(0); } 30% { transform: rotate(14deg); } 46% { transform: rotate(-10deg); } 62% { transform: rotate(7deg); } 78% { transform: rotate(-4deg); } 92% { transform: rotate(2deg); } 100% { transform: rotate(0deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
@keyframes cardWobble { 0%, 100% { transform: rotate(1.8deg); } 50% { transform: rotate(-1.8deg); } }
@keyframes shine { 0% { transform: translateX(-340px) skewX(-18deg); } 55%, 100% { transform: translateX(420px) skewX(-18deg); } }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1.2); } }

.settle { transform-origin: 210px 6px; animation: settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards; }
.sway { transform-origin: 210px 6px; animation: sway 4.2s ease-in-out 3.4s infinite; }
.wob { transform-origin: 210px 300px; animation: cardWobble 4.2s ease-in-out 3.4s infinite; }
.shine { animation: shine 4.5s ease-in-out 3.6s infinite; }
.tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
]]></style>

<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#e63946"/>
  <stop offset="50%" stop-color="#ff9f1c"/>
  <stop offset="100%" stop-color="#e63946"/>
</linearGradient>

<linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#1c0b10"/>
  <stop offset="100%" stop-color="#100508"/>
</linearGradient>

<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%"><animate attributeName="stop-color" values="#ff9f1c;#ffd166;#e63946;#ff9f1c" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#e63946;#ff9f1c;#ffd166;#e63946" dur="5s" repeatCount="indefinite"/></stop>
</linearGradient>

<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#d4af37"/>
  <stop offset="45%" stop-color="#aa7c11"/>
  <stop offset="55%" stop-color="#886008"/>
  <stop offset="100%" stop-color="#ffd700"/>
</linearGradient>

<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".18"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#ffd166;#ff9f1c;#ffd166" dur="4s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#ff9f1c;#e63946;#ff9f1c" dur="4s" repeatCount="indefinite"/></stop>
</linearGradient>

<radialGradient id="lglow"><stop offset="0%" stop-color="#ff9f1c" stop-opacity=".25"/><stop offset="100%" stop-color="#ff9f1c" stop-opacity="0"/></radialGradient>
<filter id="glow2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".75"/></filter>
<clipPath id="cardclip"><rect x="82" y="298" width="256" height="330" rx="20"/></clipPath>
<clipPath id="lanyardAvatarClip"><circle cx="45" cy="45" r="42"/></clipPath>
</defs>

<!-- Background Glowing Aura -->
<circle cx="210" cy="440" r="230" fill="url(#lglow)"><animate attributeName="r" values="230;255;230" dur="4.5s" repeatCount="indefinite"/></circle>

<g class="settle">
<g class="sway">

  <!-- Straps -->
  <path d="M148 -10 L198 250 L204 250 L156 -10 Z" fill="url(#strapg)"/>
  <path d="M272 -10 L222 250 L216 250 L264 -10 Z" fill="url(#strapg)"/>

  <!-- Clip -->
  <g transform="translate(192, 235)">
    <rect x="0" y="0" width="36" height="20" rx="4" fill="url(#metal)"/>
    <circle cx="18" cy="10" r="5" fill="#14070a"/>
    <path d="M12 20 L12 36 Q12 44 18 44 Q24 44 24 36 L24 20 Z" fill="url(#metal)"/>
    <rect x="8" y="42" width="20" height="18" rx="4" fill="url(#metal)"/>
  </g>

  <!-- ID Card Body -->
  <g class="wob" filter="url(#cardShadow)">
    <rect x="80" y="296" width="260" height="334" rx="22" fill="url(#cardborder)"/>
    <rect x="82" y="298" width="256" height="330" rx="20" fill="url(#cardbg)"/>
    <rect x="180" y="306" width="60" height="12" rx="6" fill="#0d0406" stroke="url(#metal)" stroke-width="1.5"/>

    <path d="M82 328 h256 v45 h-256 z" fill="#290e15"/>
    <text x="210" y="356" fill="#ffd166" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle" filter="url(#glow2)">🔥 HASHIRA PASS</text>
    <line x1="82" y1="373" x2="338" y2="373" stroke="#ff9f1c" stroke-width="1.5" opacity=".8"/>

    <!-- Avatar Portrait Frame with Deswanth's Photo -->
    <g transform="translate(165, 385)">
      <circle cx="45" cy="45" r="45" fill="#240c14" stroke="url(#cardborder)" stroke-width="3" filter="url(#glow2)"/>
      <g clip-path="url(#lanyardAvatarClip)">
        <image href="./deswanth-avatar.png" xlink:href="https://raw.githubusercontent.com/deswanth12/deswanth12/main/deswanth-avatar.png" x="-3" y="-8" width="96" height="110" preserveAspectRatio="xMidYMid slice"/>
      </g>
    </g>

    <!-- User Details (DESWANTH) -->
    <g transform="translate(210, 502)">
      <text class="card-name" x="0" y="0" fill="url(#nameg)" font-size="22" text-anchor="middle" filter="url(#glow2)">DESWANTH</text>
      <text x="0" y="20" fill="#ffd166" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle">FRONTEND &amp; ANIME CRAFTSMAN</text>
      <line x1="-90" y1="32" x2="90" y2="32" stroke="#e63946" stroke-width="1" opacity=".5"/>

      <text x="-80" y="52" fill="#a08088" font-size="10">ID NO:</text>
      <text x="-80" y="66" fill="#ffffff" font-size="11" font-weight="700">#FLAME-1212</text>

      <text x="20" y="52" fill="#a08088" font-size="10">RANK:</text>
      <text x="20" y="66" fill="#ff9f1c" font-size="11" font-weight="700">SSS HASHIRA</text>
    </g>

    <!-- Barcode -->
    <g transform="translate(112, 592)" opacity=".85">
      <rect x="0" y="0" width="196" height="22" fill="#fff" rx="4"/>
      <path d="M10 3v16M14 3v16M16 3v16M22 3v16M26 3v16M32 3v16M36 3v16M40 3v16M48 3v16M52 3v16M58 3v16M64 3v16M70 3v16M74 3v16M80 3v16M86 3v16M92 3v16M98 3v16M104 3v16M110 3v16M116 3v16M122 3v16M128 3v16M134 3v16M140 3v16M146 3v16M152 3v16M158 3v16M164 3v16M170 3v16M176 3v16M182 3v16" stroke="#000" stroke-width="2"/>
    </g>

    <g clip-path="url(#cardclip)">
      <rect class="shine" x="82" y="298" width="160" height="330" fill="url(#shineg)"/>
    </g>
  </g>
</g>
</g>
</svg>
