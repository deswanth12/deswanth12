<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" role="img" aria-label="GitHub Stats Card">
<title>Deswanth's GitHub Stats</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Outfit:wght@700&display=swap');
text { font-family: 'Fira Code', Consolas, monospace; }
.title { font-family: 'Outfit', sans-serif; font-weight: 700; fill: #ffd166; font-size: 17px; }
.stat-label { fill: #c0a0a8; font-size: 13px; }
.stat-value { fill: #ffffff; font-weight: 700; font-size: 14px; }
@keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; filter: drop-shadow(0 0 8px #ff9f1c); } }
.rank-ring { animation: pulse 3s ease-in-out infinite; }
]]></style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#180a0e"/>
  <stop offset="100%" stop-color="#100508"/>
</linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff9f1c"/>
  <stop offset="50%" stop-color="#e63946"/>
  <stop offset="100%" stop-color="#ffd166"/>
</linearGradient>
</defs>

<!-- Card Frame -->
<rect width="495" height="195" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>

<!-- Header -->
<g transform="translate(25, 35)">
  <text class="title" x="0" y="0">🔥 DESWANTH'S GITHUB STATS</text>
  <line x1="0" y1="12" x2="445" y2="12" stroke="#e63946" stroke-width="1" opacity="0.4"/>
</g>

<!-- Stats Grid -->
<g transform="translate(30, 75)">
  <g transform="translate(0, 0)">
    <text x="0" y="0" class="stat-label">⭐ Total Stars Earned:</text>
    <text x="180" y="0" class="stat-value" fill="#ffd166">50+ Stars</text>
  </g>
  <g transform="translate(0, 26)">
    <text x="0" y="0" class="stat-label">⚡ Total Commits:</text>
    <text x="180" y="0" class="stat-value" fill="#ff9f1c">500+ Commits</text>
  </g>
  <g transform="translate(0, 52)">
    <text x="0" y="0" class="stat-label">🔀 Pull Requests:</text>
    <text x="180" y="0" class="stat-value" fill="#ffd166">40+ Merged</text>
  </g>
  <g transform="translate(0, 78)">
    <text x="0" y="0" class="stat-label">🎯 Contributed Repos:</text>
    <text x="180" y="0" class="stat-value" fill="#ff6b35">12+ Projects</text>
  </g>
</g>

<!-- Rank Badge Circle -->
<g transform="translate(390, 115)" class="rank-ring">
  <circle cx="0" cy="0" r="42" fill="#240c14" stroke="#ff9f1c" stroke-width="3"/>
  <text x="0" y="-6" fill="#a08088" font-size="10" font-weight="700" text-anchor="middle">RANK</text>
  <text x="0" y="16" fill="#ffd166" font-size="22" font-weight="700" text-anchor="middle">A+</text>
</g>
</svg>
