<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="K Deswanth — Software Developer">
<title>K Deswanth — Software Developer | Python, Flutter &amp; Open Source</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap');
text { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; }
.code-font { font-family: 'Fira Code', Consolas, monospace; }
.title-font { font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -1px; }

@keyframes floatSoft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pulseGlowLight { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(224, 122, 95, 0.5)); } }
@keyframes twinkleStar { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
@keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes hlShine { 0% { transform: translateX(-300px) skewX(-20deg); } 40%, 100% { transform: translateX(380px) skewX(-20deg); } }
@keyframes runeGlow { 0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 6px rgba(230, 57, 70, 0.7)); } 50% { opacity: 1; filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.9)); } }

.float-card { animation: floatSoft 5s ease-in-out infinite; }
.star-twinkle { transform-box: fill-box; transform-origin: center; animation: twinkleStar 3.2s ease-in-out infinite; }
.glow-ring { animation: pulseGlowLight 4s ease-in-out infinite; }
.cur { animation: cursorBlink 0.9s step-end infinite; }
.tag-pill { transition: transform 0.2s ease; }
.tag-pill:hover { transform: scale(1.05); }
.hl-shine { animation: hlShine 5s ease-in-out infinite; }
.rune-glow { animation: runeGlow 3.5s ease-in-out infinite; }
]]></style>

<linearGradient id="canvasBgLight" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#fff9f6"/>
  <stop offset="50%" stop-color="#fdf4ee"/>
  <stop offset="100%" stop-color="#f8ece4"/>
</linearGradient>

<linearGradient id="cardBorderLight" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#e07a5f" stop-opacity="0.5"/>
  <stop offset="50%" stop-color="#f4a261" stop-opacity="0.3"/>
  <stop offset="100%" stop-color="#e76f51" stop-opacity="0.2"/>
</linearGradient>

<linearGradient id="titleGradLight" x1="0" y1="0" x2="1" y2="0">
