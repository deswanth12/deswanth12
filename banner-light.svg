  <stop offset="42%" stop-color="#ffffff" stop-opacity="0.06"/>
  <stop offset="50%" stop-color="#ffd166" stop-opacity="0.22"/>
  <stop offset="58%" stop-color="#ff3366" stop-opacity="0.12"/>
