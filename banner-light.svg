<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="K Deswanth — Principal Software Developer &amp; Open Source Hunter">
<title>K Deswanth — Software Developer | Python, Flutter &amp; Open Source</title>
<defs>
<style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap');
text { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; }
.code-font { font-family: 'Fira Code', Consolas, monospace; }
.title-font { font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -1.5px; }

@keyframes floatHaptic { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes pulseAuraLight { 0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 16px rgba(224, 122, 95, 0.3)); } 50% { opacity: 0.7; filter: drop-shadow(0 0 24px rgba(244, 162, 97, 0.45)); } }
@keyframes twinkleSoft { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 0.95; transform: scale(1.15); } }
@keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes holoSheen { 0% { transform: translateX(-320px) skewX(-22deg); } 42%, 100% { transform: translateX(400px) skewX(-22deg); } }
@keyframes crestGlowLight { 0%, 100% { filter: drop-shadow(0 0 6px rgba(224, 122, 95, 0.7)); } 50% { filter: drop-shadow(0 0 12px rgba(244, 162, 97, 0.85)); } }

.float-card { animation: floatHaptic 5.5s cubic-bezier(0.32, 0.72, 0, 1) infinite; }
.star-twinkle { transform-box: fill-box; transform-origin: center; animation: twinkleSoft 3.5s ease-in-out infinite; }
.aura-pulse { animation: pulseAuraLight 4.5s ease-in-out infinite; }
.cur { animation: cursorBlink 0.85s step-end infinite; }
.crest-pulse { animation: crestGlowLight 3.6s ease-in-out infinite; }
.holo-sweep { animation: holoSheen 5.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
.interactive-pill { transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1); }
.interactive-pill:hover { transform: translateY(-2px); }
]]></style>

<!-- Canvas Gradients (Warm Editorial Luxury Paper) -->
