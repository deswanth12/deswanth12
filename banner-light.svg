</filter>

<clipPath id="hlCardClipLight">
  <rect x="548" y="118" width="272" height="176" rx="14"/>
</clipPath>
</defs>

<!-- Outer Card Frame -->
<rect width="1200" height="420" rx="22" fill="url(#canvasBgLight)"/>
<rect width="1196" height="416" x="2" y="2" rx="21" fill="none" stroke="url(#cardBorderLight)" stroke-width="1.5"/>

<!-- Ambient Warm Lighting -->
<rect width="1200" height="420" rx="22" fill="url(#ambientGlowLight1)"/>
<rect width="1200" height="420" rx="22" fill="url(#ambientGlowLight2)"/>

