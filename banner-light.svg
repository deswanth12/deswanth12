  <stop offset="0%" stop-color="#24111d"/>
  <stop offset="40%" stop-color="#341326"/>
  <stop offset="80%" stop-color="#200d1a"/>
  <stop offset="100%" stop-color="#180713"/>
</linearGradient>

<linearGradient id="hlBorderGradLight" x1="0" y1="0" x2="1" y2="1">
